<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <!-- Filter for subtle crispness -->
    <filter id="crisp" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Yellow Background Emblem -->
  <rect width="540" height="180" rx="20" fill="#FFD233" />

  <!-- Inner border line for finished badge feel -->
  <rect x="6" y="6" width="528" height="168" rx="15" fill="none" stroke="#F5C418" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Main Wordmark FEAzTO -->
  <g id="feazto-wordmark" transform="translate(270, 88)" text-anchor="middle">
    <!-- Drop shadow backing text for contrast -->
    <text font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="78" 
          letter-spacing="5"
          y="2">
      <tspan fill="#121212">FE</tspan><tspan fill="#FFFFFF">Az</tspan><tspan fill="#121212">TO</tspan>
    </text>
    <text font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="78" 
          letter-spacing="5">
      <tspan fill="#121212">FE</tspan><tspan fill="#FFFFFF">Az</tspan><tspan fill="#121212">TO</tspan>
    </text>
  </g>

  <!-- Divider Line Between Wordmark and Tagline -->
  <line x1="80" y1="116" x2="460" y2="116" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-opacity="0.2"/>

  <!-- Tagline: FOOD • CULTURE • CONNECT -->
  <g id="feazto-tagline" transform="translate(270, 144)" text-anchor="middle">
    <text font-family="'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="14.5" 
          letter-spacing="6.5" 
          fill="#121212">
      FOOD <tspan fill="#E65100" font-size="16">•</tspan> CULTURE <tspan fill="#E65100" font-size="16">•</tspan> CONNECT
    </text>
  </g>
</svg>
