<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 116" width="100%" height="100%">
  <defs>
    <!-- Filter for crisp logo edges -->
    <filter id="crisp" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Golden Yellow Background Pill (#F8B504) -->
  <rect width="394" height="116" rx="16" fill="#F8B504" />

  <!-- Main Wordmark: FEA in WHITE, Z in BLACK, TO in WHITE -->
  <g id="feazto-wordmark" transform="translate(197, 72)" text-anchor="middle">
    <text font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="64" 
          letter-spacing="2">
      <tspan fill="#FFFFFF">FEA</tspan><tspan fill="#111111">Z</tspan><tspan fill="#FFFFFF">TO</tspan>
    </text>
  </g>

  <!-- Tagline: FOOD • CULTURE • CONNECT in Crisp Black -->
  <g id="feazto-tagline" transform="translate(197, 98)" text-anchor="middle">
    <text font-family="'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="13" 
          letter-spacing="4.5" 
          fill="#111111">
      FOOD <tspan font-size="14" dy="-1">•</tspan><tspan dy="1"> CULTURE </tspan><tspan font-size="14" dy="-1">•</tspan><tspan dy="1"> CONNECT</tspan>
    </text>
  </g>
</svg>
