<svg width="400" height="24" viewBox="0 0 400 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Horizontal Kolam Border Motif with dots and looping arches -->
  <g stroke="#F5B700" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 4 H400" stroke-dasharray="2 4" opacity="0.6"/>
    <!-- Intersecting arch waves -->
    <path d="M0 12 Q20 4, 40 12 T80 12 T120 12 T160 12 T200 12 T240 12 T280 12 T320 12 T360 12 T400 12" />
    <path d="M0 12 Q20 20, 40 12 T80 12 T120 12 T160 12 T200 12 T240 12 T280 12 T320 12 T360 12 T400 12" />
    <path d="M0 20 H400" stroke-dasharray="2 4" opacity="0.6"/>
  </g>
  <!-- Dot accents -->
  <circle cx="20" cy="12" r="2.2" fill="#F5B700" />
  <circle cx="60" cy="12" r="2.2" fill="#F5B700" />
  <circle cx="100" cy="12" r="2.2" fill="#F5B700" />
  <circle cx="140" cy="12" r="2.2" fill="#F5B700" />
  <circle cx="180" cy="12" r="2.2" fill="#F5B700" />
  <circle cx="220" cy="12" r="2.2" fill="#F5B700" />
  <circle cx="260" cy="12" r="2.2" fill="#F5B700" />
  <circle cx="300" cy="12" r="2.2" fill="#F5B700" />
  <circle cx="340" cy="12" r="2.2" fill="#F5B700" />
  <circle cx="380" cy="12" r="2.2" fill="#F5B700" />
</svg>
